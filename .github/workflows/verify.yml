name: Verify Layout Studio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check app.js
      - name: Validate required application assets
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -q 'app.js' index.html
          grep -q 'styles.css' index.html
          grep -q 'Complete design package' index.html
          grep -q 'function createZip' app.js
