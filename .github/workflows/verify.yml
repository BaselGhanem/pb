name: Verify Layout Studio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check layouts.js
          node --check tests/layouts.test.js
      - name: Check 120 templates and quick builder
        run: node tests/layouts.test.js
